name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe badanie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: podpowiedzi Google i Binga dla Litwy (atrakcje na eventy, wesela, wodzireje,
# fotobudki). Wyniki trafiają z powrotem na tę gałąź (badania/wyniki/). Niczego poza tym nie zmienia.
# Gałąź diagnoza-domen do usunięcia po badaniu.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Podpowiedzi wyszukiwarek — Litwa
        run: python3 badania/podpowiedzi.py
      - name: Zapis wyników na gałęzi
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add badania/wyniki
          git commit -q -m "Wyniki badania: podpowiedzi wyszukiwarek LT" && git push -q origin HEAD:diagnoza-domen
          echo "unikalnych podpowiedzi: $(wc -l < badania/wyniki/podpowiedzi.txt)"
