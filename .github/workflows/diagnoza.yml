name: Diagnoza domen 33bots (jednorazowa)

# Badanie konkurencji z sieci GitHuba (sesja Claude nie ma dostępu do tych stron):
# robotivo.pl — zrzuty w kolejnych punktach przewijania, wideo przewijania, struktura,
# biblioteki animacji, podstrony z menu. Wyniki wracają na gałąź do badania/wyniki/.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Przeglądarka
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Nagłówki danych robota na .de i .lt
        run: |
          mkdir -p badania/wyniki/zywo
          for d in 33bots.de 33bots.lt; do for u in /css/glowna.css /robot/g1.bin /robot/g1-lekki.bin; do
            echo "== $d$u"; curl -s -o /dev/null -D - "https://$d$u" | grep -iE '^(HTTP|content-type|content-length|cache-control)'
          done; done | tee badania/wyniki/zywo/naglowki-rynki.txt
      - name: Strona główna na żywo — .pl, .de, .lt
        run: mkdir -p badania/wyniki/zywo && node badania/rynki.mjs
      - name: Zapis wyników na gałąź
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add badania/wyniki
          git commit -q -m "Wyniki: kontrola na żywo stron głównych .pl, .de, .lt" && git push -q origin HEAD:diagnoza-domen
