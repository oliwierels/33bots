name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: nowe strony .de (Unitree G1, Preise, case studies) i przekierowania wpisów bloga
# na żywo, RSS, oraz dlaczego IndexNow odrzuca klucz .de (403). Niczego poza tym nie zmienia.
# Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 33bots.de — mapa, nowe strony, przekierowania wpisów
        run: |
          set +e
          curl -s --max-time 30 https://33bots.de/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > de.txt
          echo "mapa .de: $(wc -l < de.txt) adresów"
          zle=0; while read -r u; do k=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u"); [ "$k" = "200" ] || { echo "KOD $k: $u"; zle=$((zle+1)); }; done < de.txt
          echo "błędne kody w mapie: $zle"
          for s in unitree-g1-mieten roboter-mieten-preise case-study-eco-studio-electro-system case-study-grupa-rekord-mspo case-study-centrum-nauki-kopernik case-study-ogrod-przelewice; do
            curl -s --max-time 20 "https://33bots.de/$s.html" -o s.html
            echo "$s: $(grep -o '<title>[^<]*' s.html | head -1) | nowy układ: $(grep -c 'buduj_podstrony.py' s.html)"
          done
          for s in blog-unitree-g1-roboter blog-was-kostet-roboter-mieten blog-roboter-mieten-leitfaden blog-logistik-am-eventtag; do
            echo "$s → $(curl -s -o /dev/null -I --max-time 20 -w '%{http_code} %{redirect_url}' "https://33bots.de/$s.html")"
          done
          echo "RSS: $(curl -s --max-time 20 https://33bots.de/feed.xml | grep -c '<item>') wpisów"
          echo "stopka z Preise i Unitree: $(curl -s --max-time 20 https://33bots.de/ | grep -c -E 'roboter-mieten-preise.html|unitree-g1-mieten.html')"

      - name: IndexNow — dlaczego 403 dla 33bots.de
        run: |
          set +e
          K=a2813e79cb1d1017ecf75f8b739153a3
          echo "--- plik klucza zwykłym curl:"
          curl -s -D - --max-time 20 "https://33bots.de/$K.txt" | head -20
          echo "--- plik klucza z UA Bingbota:"
          curl -s -o /dev/null -w '%{http_code} %{content_type} %{redirect_url}\n' -A 'Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)' --max-time 20 "https://33bots.de/$K.txt"
          echo "--- przez www i http:"
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 20 "https://www.33bots.de/$K.txt"
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 20 "http://33bots.de/$K.txt"
          echo "--- GET api.indexnow.org (jeden adres):"
          curl -s -w '\nkod %{http_code}\n' --max-time 20 "https://api.indexnow.org/indexnow?url=https://33bots.de/unitree-g1-mieten.html&key=$K"
          echo "--- GET bing.com/indexnow (jeden adres):"
          curl -s -w '\nkod %{http_code}\n' --max-time 20 "https://www.bing.com/indexnow?url=https://33bots.de/unitree-g1-mieten.html&key=$K"
          echo "--- GET yandex (jeden adres):"
          curl -s -w '\nkod %{http_code}\n' --max-time 20 "https://yandex.com/indexnow?url=https://33bots.de/unitree-g1-mieten.html&key=$K"
          echo "--- dla porównania .at (GET bing):"
          curl -s -w '\nkod %{http_code}\n' --max-time 20 "https://www.bing.com/indexnow?url=https://33bots.at/&key=d26cc6827bff8b3fdaebd366644a7aec"
