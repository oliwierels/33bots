name: Diagnoza domen 33bots (jednorazowa)

# Badanie konkurencji z sieci GitHuba (sesja Claude nie ma dostępu do tych stron):
# robotivo.pl — zrzuty w kolejnych punktach przewijania, wideo przewijania, struktura,
# biblioteki animacji, podstrony z menu. Wyniki wracają na gałąź do badania/wyniki/.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Przeglądarka
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: robotivo.pl — strona główna
        run: node badania/strony.mjs https://www.robotivo.pl/ badania/wyniki/robotivo/glowna
      - name: robotivo.pl — podstrony z menu
        run: |
          python3 - <<'PY'
          import json, urllib.parse
          d = json.load(open('badania/wyniki/robotivo/glowna/komputer.json'))
          adresy = []
          for l in d['nawigacja']:
              href = l.split(' → ')[-1]
              if not href or href.startswith(('#', 'mailto:', 'tel:', 'javascript')): continue
              u = urllib.parse.urljoin('https://www.robotivo.pl/', href)
              if 'robotivo.pl' in u and u.rstrip('/') != 'https://www.robotivo.pl' and u not in adresy: adresy.append(u)
          open('podstrony.txt', 'w').write('\n'.join(adresy[:6]))
          print('\n'.join(adresy[:6]))
          PY
          i=0; while read -r u; do i=$((i+1)); timeout 300 node badania/strony.mjs "$u" "badania/wyniki/robotivo/podstrona-$i" || true; echo "$u" > "badania/wyniki/robotivo/podstrona-$i/adres.txt"; done < podstrony.txt
      - name: Zapis wyników na gałąź
        run: |
          find badania/wyniki/robotivo -name '*.webm' -size +40M -delete
          du -sh badania/wyniki/robotivo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add badania/wyniki
          git commit -q -m "Wyniki badania: robotivo.pl (zrzuty, wideo, struktura)" && git push -q origin HEAD:diagnoza-domen
