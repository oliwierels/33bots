name: Diagnoza domen 33bots (jednorazowa)

# Badanie konkurencji z sieci GitHuba (sesja Claude nie ma dostępu do tych stron):
# robotivo.pl — zrzuty w kolejnych punktach przewijania, wideo przewijania, struktura,
# biblioteki animacji, podstrony z menu. Wyniki wracają na gałąź do badania/wyniki/.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Przeglądarka
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnoza widoczności 33bots.de
        run: |
          mkdir -p badania/wyniki/zywo
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          bash badania/seo_de.sh 2>&1 | tee badania/wyniki/zywo/seo_de.txt
      - name: Zapis wyników na gałąź
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add badania/wyniki
          git commit -q -m "Wyniki: diagnoza widoczności 33bots.de" && git push -q origin HEAD:diagnoza-domen
