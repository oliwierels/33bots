name: Diagnoza domen 33bots (jednorazowa)

# Badanie konkurencji z sieci GitHuba (sesja Claude nie ma dostępu do tych stron):
# robotivo.pl — zrzuty w kolejnych punktach przewijania, wideo przewijania, struktura,
# biblioteki animacji, podstrony z menu. Wyniki wracają na gałąź do badania/wyniki/.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola na żywo po wdrożeniu (cztery domeny)
        run: mkdir -p badania/wyniki/po-wdrozeniu && python3 badania/po_wdrozeniu.py badania/wyniki/po-wdrozeniu/2026-11-14.json
      - name: Zapis wyników na gałąź
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add badania/wyniki
          git commit -q -m "Wyniki: kontrola na żywo po wdrożeniu" && git push -q origin HEAD:diagnoza-domen
