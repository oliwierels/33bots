name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe badanie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: pozycje 33bots.pl/.de/.at/.lt w Google, Bing i DuckDuckGo dla kluczowych fraz
# oraz indeksacja nowych stron — punkt odniesienia przed dalszą pracą nad SEO.
# Tylko odczyt. Gałąź diagnoza-domen do usunięcia po badaniu.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pozycje w Google, Bing i DuckDuckGo
        run: python3 -u badania/pozycje.py
