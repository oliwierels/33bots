name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Niczego nie wdraża i nie zmienia. Tym razem: 33bots.at po wdrożeniu z 23.10 wieczorem —
# podstrony .at po przeniesieniu do nowego układu: status, placeholdery, CSP, pomiar, formularz, filmy.
# Formularze NIE są wysyłane: każde żądanie do formspree.io / formsubmit.co jest przerywane.
# Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Podstrony .at po przeniesieniu
        run: |
          set +e
          curl -s --max-time 30 https://33bots.at/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > /tmp/adresy.txt
          echo "mapa .at: $(wc -l < /tmp/adresy.txt) adresów"
          for u in $(cat /tmp/adresy.txt) https://33bots.at/danke.html https://33bots.at/404.html; do
            curl -sS -o /tmp/s.html -D /tmp/h.txt --max-time 30 "$u"
            echo "$(head -1 /tmp/h.txt | tr -d '\r' | cut -d' ' -f2) · generator: $(grep -c buduj_podstrony /tmp/s.html) · placeholdery: $(grep -c -E 'ergänzen|\[PLZ\]' /tmp/s.html) · kostenlos: $(grep -c -i kostenlos /tmp/s.html) · css: $(grep -o 'css/site.css?v=[0-9a-f]*' /tmp/s.html | head -1) · $u"
          done
          echo "Impressum: $(curl -s --max-time 30 https://33bots.at/impressum.html | grep -o -E '33Bots Bartosz Wysocki|PL5253090645|544792095' | sort -u | tr '\n' ' ')"
          echo "Nieistniejący adres: $(curl -s -o /tmp/n.html -w '%{http_code}' --max-time 30 https://33bots.at/gibt-es-nicht.html) · $(grep -o '<h1[^>]*>[^<]*' /tmp/n.html)"
          echo "js/strona.js: $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://33bots.at/js/strona.js)"

      - name: Chrome — CSP, pomiar, formularze, filmy
        run: |
          set +e
          mkdir -p /tmp/k && cd /tmp/k && npm init -y >/dev/null && npm i -s playwright-core@1.48.2 >/dev/null 2>&1
          cat > k.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          const strony = [
            'https://33bots.at/kontakt.html', 'https://33bots.at/roboter-mieten-wien.html', 'https://33bots.at/messe-roboter-mieten.html',
            'https://33bots.at/impressum.html', 'https://33bots.at/datenschutz.html', 'https://33bots.at/404.html',
          ];
          for (const url of strony) {
            const ctx = await b.newContext({ viewport: { width: 1366, height: 900 }, locale: 'de-DE' });
            const page = await ctx.newPage();
            const csp = [], bledy = [], pomiar = {}, nieudane = [];
            await page.route(/formspree\.io|formsubmit\.co/, (r) => r.abort());
            page.on('console', (m) => { const t = m.text(); if (/Content Security Policy|Refused to/.test(t)) csp.push(t.slice(0, 220)); });
            page.on('pageerror', (e) => bledy.push(e.message.slice(0, 200)));
            page.on('request', (r) => {
              const h = new URL(r.url()).hostname;
              if (/google-analytics|analytics\.google|googletagmanager|googleadservices|doubleclick|albacross|^www\.google\./.test(h)) pomiar[h] = (pomiar[h] || 0) + 1;
            });
            page.on('requestfailed', (r) => { if (!/formspree|formsubmit/.test(r.url())) nieudane.push(`${r.failure()?.errorText} ${r.url().slice(0, 90)}`); });
            let odp;
            try { odp = await page.goto(url, { waitUntil: 'load', timeout: 45000 }); } catch (e) { console.log(`\n=== ${url} → BŁĄD ${e.message}`); await ctx.close(); continue; }
            await page.waitForTimeout(3000);
            await page.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 700) { scrollTo(0, y); await new Promise((r) => setTimeout(r, 120)); } });
            await page.waitForTimeout(2500);
            const info = await page.evaluate(() => ({
              generator: document.documentElement.outerHTML.includes('buduj_podstrony.py'),
              form: ([...document.scripts].map((s) => s.textContent).join('').match(/fetch\(["'](https:\/\/[^"']+)["']/) || [])[1] || null,
              wideo: [...document.querySelectorAll('video')].map((v) => v.querySelector('source')?.getAttribute('src') || v.getAttribute('src') || 'BRAK ŹRÓDŁA'),
              menu: !!document.getElementById('navPrzycisk'),
            }));
            let film = '-';
            if (info.wideo.length) film = await page.evaluate(async () => {
              const v = document.querySelector('video'); v.muted = true;
              return Promise.race([v.play().then(() => `odtwarza (${v.videoWidth}×${v.videoHeight})`), new Promise((r) => setTimeout(() => r('nie rusza w 10 s'), 10000))]).catch((e) => 'błąd ' + e.name);
            });
            const naglowek = odp.headers()['content-security-policy'] || '';
            console.log(`\n=== ${url} → HTTP ${odp.status()}`);
            console.log(`  CSP w nagłówku: ${naglowek ? (naglowek.includes('googleadservices') ? 'nowa (pomiar przepuszczony)' : 'STARA') : 'brak'}`);
            console.log(`  naruszenia CSP: ${csp.length}${csp.length ? '\n    ' + [...new Set(csp)].slice(0, 6).join('\n    ') : ''}`);
            console.log(`  błędy JS: ${bledy.length ? bledy.join(' | ') : 0}`);
            console.log(`  pomiar (żądania): ${Object.entries(pomiar).map(([h, n]) => `${h}×${n}`).join(', ') || 'brak'}`);
            console.log(`  formularz → ${info.form} · nowy układ: ${info.generator} · menu: ${info.menu}`);
            console.log(`  wideo: ${info.wideo.join(', ') || '-'} · ${film}`);
            if (nieudane.length) console.log(`  nieudane żądania: ${[...new Set(nieudane)].slice(0, 6).join(' | ')}`);
            await ctx.close();
          }
          await b.close();
          EOF
          node k.mjs
