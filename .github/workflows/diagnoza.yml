name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: 33bots.pl po wdrożeniu nowego CTA w hero (data wydarzenia + „Sprawdź termin”),
# baner cookie, pasek z telefonem, zdarzenia generate_lead i cta_click; arkusz i artykuły.
# Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: 33bots.pl — strona główna po zmianie CTA
        run: |
          set +e
          curl -s --max-time 30 -H 'Cache-Control: no-cache' https://33bots.pl/ -o pl.html
          echo "kod: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://33bots.pl/)"
          for t in 'id="heroData"' 'Kiedy jest Twoje wydarzenie?' 'data-cta="hero">Sprawdź termin' 'Bez zaliczki, płacisz po wydarzeniu.' \
            'class="pasek__tel" href="tel:+48531408004"' 'class="rez__kontakty' 'generate_lead' 'cta_click' \
            'GTM-MR7R7CJ3' 'formspree.io/f/mnjwvray' 'css/site.css?v=315bb713'; do
            echo "$(grep -c -F "$t" pl.html) × $t"
          done
          echo "stary przycisk w hero (oczekiwane 0): $(grep -c 'data-cta="hero">Sprawdź dostępność terminu' pl.html)"
          curl -s --max-time 20 'https://33bots.pl/css/site.css?v=315bb713' -o site.css
          echo "css/site.css: md5 $(md5sum site.css | cut -c1-8) (oczekiwane 315bb713), .termin__rzad $(grep -c 'termin__rzad' site.css), scroll-padding $(grep -c 'scroll-padding-bottom' site.css)"
          for a in blog-atrakcje-eventowe blog-ile-kosztuje-wynajem-robota blog-wdrozenie-robota-humanoidalnego-w-firmie; do
            echo "$a: $(curl -s --max-time 20 "https://33bots.pl/$a.html" | grep -o 'css/site.css?v=[0-9a-f]*' | head -1)"
          done
          curl -s -I --max-time 20 https://33bots.pl/ > h.txt
          echo "CSP: $(grep -ic '^content-security-policy' h.txt) nagłówek(i)"
