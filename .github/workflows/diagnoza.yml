name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: 33bots.pl po zmianie napisu CTA na „Sprawdź termin i cenę”.
# Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: 33bots.pl — napisy CTA i arkusz
        run: |
          set +e
          curl -s --max-time 30 -H 'Cache-Control: no-cache' https://33bots.pl/ -o pl.html
          echo "kod: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://33bots.pl/)"
          for t in 'data-cta="hero">Sprawdź&nbsp;termin i&nbsp;cenę' 'data-cta="formaty">Sprawdź termin i dokładną cenę' \
            'id="wyslij">Sprawdź termin i cenę' 'data-cta="nav">Sprawdź termin i cenę' 'nav__cta" href="#kontakt" data-cta="nav">Sprawdź termin<' \
            'data-cta="sticky">Sprawdź termin' 'id="heroData"' 'generate_lead' 'css/site.css?v=d7bf1447'; do
            echo "$(grep -c -F "$t" pl.html) × $t"
          done
          echo "„Sprawdź dostępność terminu” na stronie głównej (oczekiwane 0): $(grep -c 'Sprawdź dostępność terminu' pl.html)"
          curl -s --max-time 20 'https://33bots.pl/css/site.css?v=d7bf1447' -o s.css
          echo "arkusz: md5 $(md5sum s.css | cut -c1-8) (oczekiwane d7bf1447), minmax w .termin: $(grep -c 'grid-template-columns: minmax(0, 1fr); gap: 12px' s.css)"
          echo "artykuł: $(curl -s --max-time 20 https://33bots.pl/blog-atrakcje-eventowe.html | grep -o 'css/site.css?v=[0-9a-f]*' | head -1)"
