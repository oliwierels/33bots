name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: 33bots.pl po wdrożeniu banera cookie ustępującego ConsentBoard
# i poprawek dostępności stron prawnych. Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: 33bots.pl — baner cookie na żywo (cztery warianty kodu)
        run: |
          set +e
          for u in https://33bots.pl/ https://33bots.pl/blog-atrakcje-eventowe.html https://33bots.pl/robot-na-targi.html https://33bots.pl/sklep.html https://33bots.pl/wdrozenia.html https://33bots.pl/regulamin.html https://33bots.pl/polityka-prywatnosci.html; do
            curl -s --max-time 30 -H 'Cache-Control: no-cache' "$u" -o s.html
            echo "$u: kod $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u"), 33bots-cmp w HTML $(grep -c '33bots-cmp' s.html), main.js $(grep -o 'main.js?v=[0-9a-f]*' s.html | head -1 | sed 's/.*v=//'), strona.js $(grep -o 'js/strona.js?v=[0-9a-f]*' s.html | head -1 | sed 's/.*v=//'), baner $(grep -c 'id="cookies"\|id="cookieBanner"' s.html)"
          done
          echo "oczekiwane: main.js 3f48f25c, strona.js d8d4525a"
          for s in main.js js/strona.js; do curl -s --max-time 20 "https://33bots.pl/$s" -o x.js; echo "$s z serwera: $(wc -c < x.js) B, 33bots-cmp $(grep -c '33bots-cmp' x.js), consentboard $(grep -c 'consentboard' x.js)"; done
      - name: Strony prawne — dostępność i CSP
        run: |
          set +e
          curl -s --max-time 30 -H 'Cache-Control: no-cache' https://33bots.pl/polityka-prywatnosci.html -o p.html -D h.txt
          echo "polityka: tabela z fokusem $(grep -c 'overflow-x-auto" tabindex="0" role="region"' p.html), nagłówki tabeli jaśniejsze $(grep -c 'tracking-widest text-neutral-400' p.html), stare neutral-500/600 $(grep -c 'text-neutral-500\|text-neutral-600' p.html), iframe ConsentBoard $(grep -c 'cmp-cookies.php?id=e6931d15cd160334' p.html)"
          csp=$(grep -i '^content-security-policy' h.txt | tr -d '\r')
          for d in script-src frame-src; do echo "CSP $d zawiera consentboard: $(echo "$csp" | grep -o "$d [^;]*" | grep -c 'consentboard.com')"; done
          curl -s --max-time 30 -H 'Cache-Control: no-cache' https://33bots.pl/regulamin.html -o r.html
          echo "regulamin: stare neutral-500/600 $(grep -c 'text-neutral-500\|text-neutral-600' r.html), NIP $(grep -c 5253090645 r.html)"
      - name: Kontener GTM — tagi Ads (numer bez przedrostka AW-) i ConsentBoard
        run: |
          set +e
          curl -s --max-time 30 'https://www.googletagmanager.com/gtm.js?id=GTM-MR7R7CJ3' -o gtm.js
          echo "gtm.js: $(wc -c < gtm.js) B, '18167851767': $(grep -o '18167851767' gtm.js | wc -l), etykiety tel/mail: $(grep -o 'HilICKPIk9scEPfVjddD\|VYQSCO7Am9scEPfVjddD' gtm.js | sort -u | tr '\n' ' '), consentboard: $(grep -o -i consentboard gtm.js | wc -l)"
