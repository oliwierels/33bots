name: Diagnoza domen 33bots (jednorazowa)

# Badanie konkurencji z sieci GitHuba (sesja Claude nie ma dostępu do tych stron):
# robotivo.pl — zrzuty w kolejnych punktach przewijania, wideo przewijania, struktura,
# biblioteki animacji, podstrony z menu. Wyniki wracają na gałąź do badania/wyniki/.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: API i serwer MCP na żywo
        run: |
          mkdir -p badania/wyniki/zywo
          sleep 75   # wdrożenie produkcyjne .pl trwa około minuty
          bash badania/api_zywo.sh 2>&1 | tee badania/wyniki/zywo/api_zywo.txt
      - name: Zapis wyników na gałąź
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add badania/wyniki
          git commit -q -m "Wyniki: API i MCP na żywo" && git push -q origin HEAD:diagnoza-domen
