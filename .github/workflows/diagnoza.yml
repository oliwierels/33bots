name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Niczego nie wdraża i nie zmienia. Tym razem: czy nowy artykuł jest na 33bots.pl
# i czy razem z nim nie poszło nic innego (nagłówek CSP bez zmian).
# Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Artykuł na żywej stronie
        run: |
          set +e
          A=https://33bots.pl/blog-wdrozenie-robota-humanoidalnego-w-firmie.html
          curl -sS -o a.html -D a.txt -w "artykuł → HTTP %{http_code} · %{size_download} B\n" -H 'Cache-Control: no-cache' "$A"
          echo "ostatnia zmiana pliku na serwerze: $(grep -i '^last-modified' a.txt | cut -d' ' -f2-)"
          curl -sS -o /dev/null -w "zwykłe wejście (bez no-cache) → HTTP %{http_code} · %{size_download} B\n" "$A"
          curl -sS -o /dev/null -L -w "przez www → HTTP %{http_code} · koniec: %{url_effective}\n" "https://www.33bots.pl/blog-wdrozenie-robota-humanoidalnego-w-firmie.html"
          echo "fragment treści: $(grep -o 'Prosty rachunek:[^<]\{0,80\}' a.html | head -1)"
          echo "tytuł: $(grep -o '<title>[^<]*' a.html)"
          echo "canonical: $(grep -o '<link rel="canonical" href="[^"]*"' a.html)"
          echo "h1: $(grep -o '<h1 class="art__h1">[^<]*' a.html)"
          echo "dane strukturalne: $(grep -o '"@type": "[A-Za-z]*"' a.html | sort | uniq -c | tr '\n' ' ')"
          echo "GTM: $(grep -c 'GTM-MR7R7CJ3' a.html)"
          for z in $(grep -o '<img src="[^"]*"' a.html | sed 's/<img src="//; s/"$//'); do printf '  obraz %s → ' "$z"; curl -s -o /dev/null -w '%{http_code}\n' "https://33bots.pl/$z"; done
          echo "--- powiązania"
          echo "blog.html: $(curl -s -H 'Cache-Control: no-cache' https://33bots.pl/blog.html | grep -c 'blog-wdrozenie-robota-humanoidalnego-w-firmie')"
          echo "wdrozenia.html: $(curl -s -H 'Cache-Control: no-cache' https://33bots.pl/wdrozenia.html | grep -c 'blog-wdrozenie-robota-humanoidalnego-w-firmie')"
          echo "sitemap.xml: $(curl -s -H 'Cache-Control: no-cache' https://33bots.pl/sitemap.xml | grep -c 'blog-wdrozenie-robota-humanoidalnego-w-firmie')"
          echo "feed.xml: $(curl -s -H 'Cache-Control: no-cache' https://33bots.pl/feed.xml | grep -c 'blog-wdrozenie-robota-humanoidalnego-w-firmie')"
          echo "llms.txt: $(curl -s -H 'Cache-Control: no-cache' https://33bots.pl/llms.txt | grep -c 'blog-wdrozenie-robota-humanoidalnego-w-firmie')"
          echo "--- nagłówek CSP 33bots.pl (ma być bez zmian, bez analytics.google.com)"
          curl -s -o /dev/null -D h.txt https://33bots.pl/
          echo "analytics.google.com w CSP: $(grep -i '^content-security-policy' h.txt | grep -c 'analytics.google.com')"
