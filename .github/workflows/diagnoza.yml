name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba: czy ramka ConsentBoard pozwala się osadzić na 33bots.pl
# (nagłówki X-Frame-Options / frame-ancestors) i co zawiera. Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nagłówki ramki ConsentBoard
        run: |
          set +e
          u='https://consentboard.com/cmp-cookies.php?id=e6931d15cd160334&embed=1'
          curl -s -D h.txt -o b.html --max-time 20 -H 'Referer: https://33bots.pl/polityka-prywatnosci.html' -H 'Sec-Fetch-Dest: iframe' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: cross-site' "$u"
          echo "--- nagłówki:"; grep -i -E '^(HTTP|x-frame-options|content-security-policy|content-type|set-cookie)' h.txt | cut -c1-300
          echo "--- treść (pierwsze 1200 znaków bez HTML):"; sed 's/<[^>]*>/ /g' b.html | tr -s ' \n' ' ' | cut -c1-1200
          echo; echo "--- czy w treści jest 33bots: $(grep -c -i 33bots b.html)"
