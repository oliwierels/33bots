name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Niczego nie wdraża i nie zmienia. Tym razem: czy 33bots.de i 33bots.at są dostępne
# dla robotów wyszukiwarek (nagłówki, robots.txt, mapy strony) i co z nich widać w indeksie.
# Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dostępność dla robotów wyszukiwarek
        run: |
          set +e
          GBOT='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          for d in 33bots.de 33bots.at 33bots.pl; do
            echo "================ $d"
            for ua in "$GBOT" "Mozilla/5.0 (X11; Linux x86_64) Chrome/141.0 Safari/537.36"; do
              curl -sS -o /tmp/s.html -D /tmp/h.txt -A "$ua" -w "HTTP %{http_code} · %{size_download} B" --max-time 30 "https://$d/"
              echo " · UA: ${ua:0:40} · x-robots-tag: $(grep -i '^x-robots-tag' /tmp/h.txt | cut -d' ' -f2- | tr -d '\r') · meta robots: $(grep -o '<meta name="robots"[^>]*' /tmp/s.html | head -1)"
            done
            echo "robots.txt: $(curl -s --max-time 20 https://$d/robots.txt | tr '\n' '|' | cut -c1-200)"
            curl -s --max-time 30 "https://$d/sitemap.xml" -o /tmp/map.xml
            grep -o '<loc>[^<]*' /tmp/map.xml | sed 's/<loc>//' > /tmp/adresy.txt
            echo "mapa strony: $(wc -l < /tmp/adresy.txt) adresów"
            : > /tmp/statusy.txt
            while read -r u; do
              printf '%s %s\n' "$(curl -s -o /dev/null -I -A "$GBOT" --max-time 20 -w '%{http_code}' "$u")" "$u" >> /tmp/statusy.txt
            done < /tmp/adresy.txt
            echo "statusy (Googlebot): $(cut -d' ' -f1 /tmp/statusy.txt | sort | uniq -c | tr '\n' ' ')"
            grep -v '^200 ' /tmp/statusy.txt | head -10
            X=$(head -40 /tmp/adresy.txt | while read -r u; do curl -s -o /dev/null -D - -A "$GBOT" --max-time 20 "$u" | grep -i '^x-robots-tag'; done | sort | uniq -c)
            echo "x-robots-tag na pierwszych 40 adresach: ${X:-brak}"
          done

      - name: Ślady w indeksie wyszukiwarek
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          for d in 33bots.de 33bots.at 33bots.pl; do
            echo "================ site:$d"
            curl -s -A "$UA" --max-time 30 "https://www.bing.com/search?q=site%3A$d&count=50&setlang=de&cc=de" -o bing.html
            echo "Bing: $(grep -oE "https?://(www\.)?$d[^\"'<> &]*" bing.html | sed 's/[.,]$//' | sort -u | wc -l) adresów z $d na 1. stronie wyników · rozmiar odpowiedzi $(wc -c < bing.html) B"
            grep -oE "https?://(www\.)?$d[^\"'<> &]*" bing.html | sort -u | head -8 | sed 's/^/   /'
            curl -s -A "$UA" --max-time 30 "https://html.duckduckgo.com/html/?q=site%3A$d&kl=de-de" -o ddg.html
            echo "DuckDuckGo: $(grep -oE "$d[^\"'<> &]*" ddg.html | sort -u | wc -l) unikalnych odnośników · rozmiar $(wc -c < ddg.html) B"
            curl -s -A "$UA" --max-time 30 -o g.html -w "Google: HTTP %{http_code} · %{size_download} B" "https://www.google.com/search?q=site%3A$d&hl=de&num=50"
            echo " · wyników z $d: $(grep -oE "https?://(www\.)?$d[^\"'<> &]*" g.html | sort -u | wc -l) · zgoda/captcha: $(grep -c -iE 'consent|captcha|unusual traffic' g.html)"
          done
          echo "================ fraza: Roboter mieten Messe (Bing, DE)"
          curl -s -A "$UA" --max-time 30 "https://www.bing.com/search?q=humanoider+Roboter+mieten&count=30&setlang=de&cc=de" -o b2.html
          grep -oE 'href="https?://[^"/]+' b2.html | sed 's/href="//' | grep -vE 'bing|microsoft|msn|live\.com|go\.microsoft' | sort | uniq -c | sort -rn | head -15
          echo "33bots w wynikach: $(grep -c '33bots' b2.html)"
