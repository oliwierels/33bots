name: Diagnoza domen 33bots (jednorazowa)

# Badanie konkurencji z sieci GitHuba (sesja Claude nie ma dostępu do tych stron):
# robotivo.pl — zrzuty w kolejnych punktach przewijania, wideo przewijania, struktura,
# biblioteki animacji, podstrony z menu. Wyniki wracają na gałąź do badania/wyniki/.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: write

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Przeglądarka
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Nagłówki plików nowej strony głównej
        run: |
          mkdir -p badania/wyniki/zywo
          V=$(curl -s "https://33bots.pl/?x=$RANDOM" | grep -o 'robot3d\.js?v=[a-f0-9]*' | head -1); echo "robot3d: $V"
          for u in "/" "/$( [ -n "$V" ] && echo js/$V || echo js/robot3d.js)" /css/glowna.css /robot/g1.bin /robot/g1-lekki.bin /robot/LICENCJA-UNITREE.txt; do
            echo "== $u"; curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "https://33bots.pl$u" | grep -iE '^(HTTP|content-type|content-encoding|content-length|cache-control)'
          done | tee badania/wyniki/zywo/naglowki.txt
          curl -s "https://33bots.pl/" | grep -c -E 'glowna\.css|robot3d\.js|data-scena|100\+' | tee -a badania/wyniki/zywo/naglowki.txt
      - name: Strona główna na żywo — robot 3D, zrzuty
        run: node badania/zywo.mjs badania/wyniki/zywo
      - name: IndexNow — zmienione strony
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"33bots.pl","key":"9209ab0a2e014f2c808446b0b4b4271a","keyLocation":"https://33bots.pl/9209ab0a2e014f2c808446b0b4b4271a.txt","urlList":["https://33bots.pl/","https://33bots.pl/atrakcje-na-impreze-firmowa.html","https://33bots.pl/pomysly-na-impreze-firmowa.html","https://33bots.pl/blog-wdrozenie-robota-humanoidalnego-w-firmie.html"]}' \
            -w "IndexNow HTTP %{http_code}\n" | tee badania/wyniki/zywo/indexnow.txt
      - name: Zapis wyników na gałąź
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add badania/wyniki
          git commit -q -m "Wyniki: kontrola na żywo strony głównej 33bots.pl" && git push -q origin HEAD:diagnoza-domen
