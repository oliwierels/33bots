name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: druga fala .de na żywo (84 strony w nowym układzie, bez usuniętych twierdzeń),
# przekierowanie szablonu case study, .at z „24 Werkstunden” — i zgłoszenie zmienionych
# stron do IndexNow (Bing, Yandex, Seznam). Niczego poza tym nie zmienia.
# Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 33bots.de — strony z mapy w nowym układzie
        run: |
          set +e
          curl -s --max-time 30 https://33bots.de/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > de.txt
          echo "mapa .de: $(wc -l < de.txt) adresów, lastmod: $(curl -s --max-time 30 https://33bots.de/sitemap.xml | grep -o '<lastmod>[^<]*' | sort | uniq -c | tr '\n' ' ')"
          zle=0; stare=0; n=0
          while read -r u; do
            n=$((n+1))
            kod=$(curl -s -o strona.html -w '%{http_code}' --max-time 20 "$u")
            [ "$kod" = "200" ] || { echo "KOD $kod: $u"; zle=$((zle+1)); continue; }
            [ "$u" = "https://33bots.de/" ] && continue
            grep -q 'Erzeugt von tresci/zagranica/buduj_podstrony.py' strona.html || { echo "STARY UKŁAD: $u"; stare=$((stare+1)); }
            for wz in 'zertifiziert' 'kostenlos' 'Karolina M.' 'Unsere Münchner Einsätze' 'Wir arbeiten auf Fachmessen' 'Bewährte Locations'; do
              grep -q "$wz" strona.html && echo "„$wz” na $u"
            done
          done < de.txt
          echo "sprawdzone: $n, błędne kody: $zle, w starym układzie: $stare"
          echo "vorlage-case-study: $(curl -s -o /dev/null -I --max-time 20 -w '%{http_code} %{redirect_url}' https://33bots.de/vorlage-case-study.html)"
          echo "nieistniejąca strona: $(curl -s -o 404.html -w '%{http_code}' --max-time 20 https://33bots.de/gibt-es-nicht.html), nowy układ: $(grep -c 'buduj_podstrony.py' 404.html)"
          echo "przykładowe przekierowanie z konsolidacji: $(curl -s -o /dev/null -I --max-time 20 -w '%{http_code} %{redirect_url}' https://33bots.de/roboter-mieten-bonn.html)"
          curl -s --max-time 20 -D naglowki.txt -o /dev/null https://33bots.de/referenzen-videos.html
          grep -i '^content-security-policy' naglowki.txt | cut -c1-120

      - name: 33bots.at — czas odpowiedzi i układ
        run: |
          set +e
          curl -s --max-time 30 https://33bots.at/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > at.txt
          n=0; stare=0
          for u in $(cat at.txt); do
            curl -s --max-time 20 "$u" -o s.html; n=$((n+1))
            grep -q '24 Stunden' s.html && echo "„24 Stunden” na $u"
            [ "$u" = "https://33bots.at/" ] || grep -q 'buduj_podstrony.py' s.html || { echo "STARY UKŁAD: $u"; stare=$((stare+1)); }
          done
          echo ".at: sprawdzone $n, w starym układzie: $stare"

      - name: Zgłoszenie do IndexNow
        run: |
          set +e
          zglos() { host=$1; key=$2; plik=$3
            python3 - "$host" "$key" "$plik" > body.json <<'EOF'
          import json, sys
          host, key, plik = sys.argv[1:4]
          urls = [l.strip() for l in open(plik) if l.strip()]
          print(json.dumps({'host': host, 'key': key, 'keyLocation': f'https://{host}/{key}.txt', 'urlList': urls}))
          EOF
            echo "$host: $(python3 -c "import json; print(len(json.load(open('body.json'))['urlList']))") adresów → $(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json)"
          }
          cp de.txt de-zgloszenie.txt; echo "https://33bots.de/vorlage-case-study.html" >> de-zgloszenie.txt
          zglos 33bots.de a2813e79cb1d1017ecf75f8b739153a3 de-zgloszenie.txt
          zglos 33bots.at d26cc6827bff8b3fdaebd366644a7aec at.txt
