name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe badanie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: ceny atrakcji eventowych w Polsce ze stron publicznych (przewodniki cenowe,
# artykuły) — zdania z kwotami w zł do poradników .pl. Tylko odczyt, wynik w logu.
# Gałąź diagnoza-domen do usunięcia po badaniu.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ceny atrakcji — Polska
        run: python3 -u badania/ceny_pl.py
