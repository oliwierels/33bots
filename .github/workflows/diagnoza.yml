name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba: polityka prywatności 33bots.pl po poprawce tła ramki ConsentBoard.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Polityka prywatności na żywo
        run: |
          set +e
          curl -s --max-time 30 -H 'Cache-Control: no-cache' https://33bots.pl/polityka-prywatnosci.html -o p.html
          echo "ramka z białym tłem: $(grep -c 'min-height:1600px;background:#ffffff' p.html), iframe ConsentBoard: $(grep -c 'cmp-cookies.php?id=e6931d15cd160334' p.html), kod: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://33bots.pl/polityka-prywatnosci.html)"
