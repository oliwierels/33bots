name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba, bo sesja Claude nie ma dostępu do internetu.
# Tym razem: 33bots.pl po dodaniu listy plików cookie ConsentBoard w polityce prywatności
# i otwarciu CSP dla consentboard.com. Gałąź diagnoza-domen do usunięcia po teście.
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: 33bots.pl — polityka prywatności i CSP
        run: |
          set +e
          u=https://33bots.pl/polityka-prywatnosci.html
          curl -s --max-time 30 -H 'Cache-Control: no-cache' "$u" -o p.html -D h.txt
          echo "polityka: kod $(head -1 h.txt | tr -d '\r'), iframe ConsentBoard $(grep -c 'consentboard.com/cmp-cookies.php?id=e6931d15cd160334' p.html), tytuł ramki $(grep -c 'title="Lista plików cookie' p.html), nagłówek $(grep -c '>Lista plików cookie<' p.html), GTM $(grep -c GTM-MR7R7CJ3 p.html)"
          csp=$(grep -i '^content-security-policy' h.txt | tr -d '\r')
          for d in script-src style-src img-src connect-src frame-src; do echo "CSP $d zawiera consentboard: $(echo "$csp" | grep -o "$d [^;]*" | grep -c 'consentboard.com')"; done
          echo "ramka ConsentBoard z sieci: $(curl -s -o cb.html -w '%{http_code}' --max-time 20 'https://consentboard.com/cmp-cookies.php?id=e6931d15cd160334&embed=1'), $(wc -c < cb.html) B, X-Frame-Options: $(curl -s -I --max-time 20 'https://consentboard.com/cmp-cookies.php?id=e6931d15cd160334&embed=1' | grep -i -c 'x-frame-options\|frame-ancestors')"
          echo "strona główna nadal ok: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://33bots.pl/)"
          echo "CSP .at i .lt (ten sam kontener GTM) zawiera consentboard: .at $(curl -s -I --max-time 20 https://33bots.at/ | grep -i '^content-security-policy' | grep -c consentboard), .lt $(curl -s -I --max-time 20 https://33bots.lt/ | grep -i '^content-security-policy' | grep -c consentboard)"
