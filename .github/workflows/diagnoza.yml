name: Diagnoza domen 33bots (jednorazowa)

# Jednorazowe sprawdzenie z sieci GitHuba: 33bots.pl po dodaniu narzędzi analitycznych
# (pliki ukryte zwracają 404, CSP przepuszcza Microsoft Clarity, narzędzia nie trafiły na serwer).
on:
  push:
    branches: [diagnoza-domen]
    paths-ignore: ['badania/wyniki/**']

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kontrola na żywo
        run: |
          set +e
          k() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1"; }
          echo "strona główna: $(k https://33bots.pl/), robots.txt: $(k https://33bots.pl/robots.txt), klucz IndexNow: $(k https://33bots.pl/9209ab0a2e014f2c808446b0b4b4271a.txt), poradnik: $(k https://33bots.pl/atrakcje-na-event.html)"
          echo "pliki ukryte: .mcp.json $(k https://33bots.pl/.mcp.json), .htaccess $(k https://33bots.pl/.htaccess), .gitignore $(k https://33bots.pl/.gitignore), .deployignore $(k https://33bots.pl/.deployignore)"
          echo "narzędzia poza serwerem: scripts/analityka/analityka.py $(k https://33bots.pl/scripts/analityka/analityka.py), mcp-ga4.sh $(k https://33bots.pl/scripts/analityka/mcp-ga4.sh)"
          csp=$(curl -s -I --max-time 20 https://33bots.pl/ | grep -i '^content-security-policy' | tr -d '\r')
          for d in script-src img-src connect-src; do echo "CSP $d: clarity $(echo "$csp" | grep -o "$d [^;]*" | grep -c 'clarity.ms'), c.bing.com $(echo "$csp" | grep -o "$d [^;]*" | grep -c 'c.bing.com'), consentboard $(echo "$csp" | grep -o "$d [^;]*" | grep -c consentboard)"; done
          echo "polityka prywatności: $(k https://33bots.pl/polityka-prywatnosci.html), stary wpis 301: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://33bots.pl/blog-atrakcja-na-event-firmowy.html)"
