name: Wdrożenie na cyber_Folks

# Uruchamia się po każdej zmianie na gałęzi produkcyjnej.
# Można też odpalić ręcznie: zakładka Actions → Wdrożenie na cyber_Folks → Run workflow.
on:
  push:
    branches: [claude/33bots-website-T0REs]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: wdrozenie-produkcja
  cancel-in-progress: false

jobs:
  wdroz:
    name: Zbuduj i wyślij na serwer
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zbuduj arkusz stylów Tailwind
        run: |
          npx --yes tailwindcss@3.4.17 \
            -c tailwind.config.js \
            -i tw-input.css \
            -o assets-redesign.css \
            --minify
          echo "Rozmiar arkusza: $(du -h assets-redesign.css | cut -f1)"

      # Numer wersji arkusza = skrót commita. Dzięki temu przeglądarka
      # nigdy nie poda starego CSS-a z pamięci podręcznej.
      - name: Podbij wersję arkusza w index.html
        run: |
          WERSJA="${GITHUB_SHA::7}"
          # celujemy wyłącznie w atrybut href, żeby nie ruszyć komentarzy w pliku
          sed -i -E "s|href=\"assets-redesign\.css(\?v=[^\"]*)?\"|href=\"assets-redesign.css?v=${WERSJA}\"|g" index.html
          echo "Arkusz oznaczony wersją: ${WERSJA}"
          grep -o 'href="assets-redesign\.css[^"]*"' index.html

      - name: Sprawdź poprawność HTML i danych strukturalnych
        run: |
          python3 - <<'PY'
          import json, re, sys
          from html.parser import HTMLParser

          zrodlo = open('index.html', encoding='utf-8').read()
          bledy = []

          PUSTE = {'meta','link','img','br','input','source','hr','iframe',
                   'path','circle','rect','polyline','line','polygon','source-marker'}

          class Kontrola(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stos = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('svg', 'iframe'): return
                  if tag not in PUSTE: self.stos.append(tag)
              def handle_endtag(self, tag):
                  if tag in PUSTE or tag == 'svg': return
                  if self.stos and self.stos[-1] == tag: self.stos.pop()
                  elif tag in self.stos:
                      while self.stos and self.stos[-1] != tag:
                          bledy.append(f'niezamknięty <{self.stos.pop()}>')
                      self.stos.pop()
                  else:
                      bledy.append(f'zbłąkany </{tag}>')

          k = Kontrola(); k.feed(zrodlo)
          if k.stos: bledy.append(f'niezamknięte na końcu: {k.stos}')

          for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', zrodlo, re.S):
              try: json.loads(m.group(1))
              except Exception as e: bledy.append(f'błędny JSON-LD: {e}')

          for konieczny in ('GTM-MR7R7CJ3', 'assets-redesign.css', 'formspree.io'):
              if konieczny not in zrodlo:
                  bledy.append(f'brak w index.html: {konieczny}')

          if bledy:
              print('WDROŻENIE WSTRZYMANE:'); [print(' -', b) for b in bledy]; sys.exit(1)
          print('index.html poprawny — struktura, dane strukturalne i analityka na miejscu.')
          PY

      # Sprawdza, czy serwer w ogóle odpowiada na FTP i czy umie szyfrować.
      # Nie przerywa wdrożenia — służy wyłącznie do rozpoznania problemu.
      - name: Rozpoznanie połączenia z serwerem
        continue-on-error: true
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          python3 - <<'PY'
          import os, socket, ssl

          host, port = os.environ['HOST'], int(os.environ['PORT'])
          print(f'Łączę się na porcie {port}…')

          try:
              s = socket.create_connection((host, port), timeout=12)
          except Exception as e:
              print(f'BRAK POŁĄCZENIA: {e}')
              print('→ Najpewniej zły adres w sekrecie FTP_SERVER.')
              raise SystemExit(0)

          s.settimeout(12)
          powitanie = s.recv(512).decode('utf-8', 'replace').strip()
          print(f'Serwer się przedstawił: {powitanie[:120]}')

          if not powitanie.startswith('220'):
              print('→ To nie wygląda na serwer FTP.')
              raise SystemExit(0)

          s.sendall(b'AUTH TLS\r\n')
          odp = s.recv(512).decode('utf-8', 'replace').strip()
          print(f'Odpowiedź na AUTH TLS: {odp[:120]}')

          if not odp.startswith('234'):
              print('WYNIK: serwer odrzuca szyfrowanie.')
              print('→ Ustaw zmienną repozytorium FTP_PROTOCOL na wartość "ftp".')
              raise SystemExit(0)

          try:
              ssl.create_default_context().wrap_socket(s, server_hostname=host)
              print('WYNIK: FTPS działa poprawnie — nic nie zmieniaj.')
          except ssl.SSLCertVerificationError as e:
              print(f'Certyfikat nie pasuje do adresu: {e.verify_message}')
              print('NAZWY, NA KTÓRE WYSTAWIONO CERTYFIKAT — patrz krok niżej.')
          except Exception as e:
              print(f'Uzgadnianie TLS nie powiodło się: {e}')
              print('WYNIK: ustaw zmienną FTP_PROTOCOL na "ftp".')
          PY

      # Wypisuje, dla jakich nazw serwer ma certyfikat — to ta nazwa
      # powinna trafić do sekretu FTP_SERVER.
      - name: Odczytaj nazwy z certyfikatu serwera
        continue-on-error: true
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          openssl s_client -starttls ftp -connect "${HOST}:${PORT}" -showcerts </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null \
            || echo 'Nie udało się odczytać certyfikatu.'

      - name: Wyślij pliki na serwer
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_DIR }}
          # Nie kasuje niczego, czego nie zna — pliki wgrane ręcznie zostają.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.py
            **/*.md
            tailwind.config.js
            tw-input.css
            package*.json
            scripts/**
            og/**
            **/IMG_*.HEIC
            **/IMG_*.DNG
            **/IMG_*.JPG
            **/IMG_*.PNG
            _redirects
            SEO-AUDIT.md
            szablon-case-study.html

      - name: Podsumowanie
        run: |
          echo "### Strona zaktualizowana" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "Arkusz stylów: \`assets-redesign.css?v=${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sprawdź: https://33bots.pl" >> $GITHUB_STEP_SUMMARY
