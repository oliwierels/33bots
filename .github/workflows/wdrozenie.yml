name: Wdrożenie na cyber_Folks

# Uruchamia się po każdej zmianie na gałęzi produkcyjnej.
# Można też odpalić ręcznie: Actions → Wdrożenie na cyber_Folks → Run workflow.
#
# Kierunek wdrożenia jest odwrotny niż przy FTP: to serwer sięga po zmiany.
# GitHub jedynie puka do punktu wdrożeniowego, a resztę robi deploy.php
# po stronie hostingu. Dzięki temu nie potrzeba połączenia FTP z zewnątrz,
# które hosting blokuje dla adresów spoza Polski.
on:
  push:
    branches: [claude/33bots-website-T0REs]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'narzedzia-serwer/**'
  workflow_dispatch:

concurrency:
  group: wdrozenie-produkcja
  cancel-in-progress: false

jobs:
  wdroz:
    name: Sprawdź i wdroż
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      # Bramka bezpieczeństwa. Gdy cokolwiek tu nie zagra, serwer nie dostanie
      # sygnału i strona zostaje w poprzedniej, działającej wersji.
      - name: Sprawdź stronę przed wdrożeniem
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          from html.parser import HTMLParser

          # Strony budowane Tailwindem — wszystkie muszą przejść kontrolę.
          # Lista wyznaczana jest tak samo jak w ./buduj.sh: po odwołaniu do arkusza.
          STRONY = sorted(
              p for p in os.listdir('.')
              if p.endswith('.html') and 'assets-redesign.css' in open(p, encoding='utf-8').read()
          )
          SUMA_ARKUSZA = hashlib.md5(open('assets-redesign.css','rb').read()).hexdigest()[:8]
          bledy = []

          PUSTE = {'meta','link','img','br','input','source','hr','iframe',
                   'path','circle','rect','polyline','line','polygon','source-marker'}

          class Kontrola(HTMLParser):
              def __init__(self, plik):
                  super().__init__(); self.stos = []; self.plik = plik
              def handle_starttag(self, tag, attrs):
                  if tag in ('svg', 'iframe'): return
                  if tag not in PUSTE: self.stos.append(tag)
              def handle_endtag(self, tag):
                  if tag in PUSTE or tag == 'svg': return
                  if self.stos and self.stos[-1] == tag: self.stos.pop()
                  elif tag in self.stos:
                      while self.stos and self.stos[-1] != tag:
                          bledy.append(f'{self.plik}: niezamknięty <{self.stos.pop()}>')
                      self.stos.pop()
                  else:
                      bledy.append(f'{self.plik}: zbłąkany </{tag}>')

          if 'index.html' not in STRONY:
              bledy.append('index.html nie odwołuje się do arkusza stylów')

          for plik in STRONY:
              zrodlo = open(plik, encoding='utf-8').read()

              k = Kontrola(plik); k.feed(zrodlo)
              if k.stos: bledy.append(f'{plik}: niezamknięte znaczniki: {k.stos}')

              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', zrodlo, re.S):
                  try: json.loads(m.group(1))
                  except Exception as e: bledy.append(f'{plik}: błędny JSON-LD: {e}')

              for konieczny in ('GTM-MR7R7CJ3', 'formspree.io'):
                  if konieczny not in zrodlo:
                      bledy.append(f'brak w {plik}: {konieczny}')

              # Czy arkusz oznaczony na stronie odpowiada temu, który leży w repozytorium.
              # Wyłapuje sytuację, w której ktoś zmienił stronę i zapomniał uruchomić ./buduj.sh
              znacznik = re.search(r'assets-redesign\.css\?v=([0-9a-f]{8})', zrodlo)
              if not znacznik:
                  bledy.append(f'{plik}: arkusz stylów bez numeru wersji — uruchom ./buduj.sh')
              elif znacznik.group(1) != SUMA_ARKUSZA:
                  bledy.append(
                      f'{plik}: arkusz nie zgadza się ze stroną (na stronie: {znacznik.group(1)}, '
                      f'faktyczny: {SUMA_ARKUSZA}) — uruchom ./buduj.sh i zatwierdź zmiany')

              # Odwołania do plików, które musimy mieć w repozytorium.
              for m in re.finditer(r'(?:src|href)="([^"#?:]+\.(?:webp|jpg|jpeg|png|svg|css|js|ico|html))', zrodlo):
                  if not os.path.exists(m.group(1)):
                      bledy.append(f'{plik}: odwołanie do nieistniejącego pliku {m.group(1)}')

          # Każda strona budowana Tailwindem musi być wymieniona w tailwind.config.js,
          # inaczej jej klasy nie trafią do arkusza i strona wyświetli się bez stylów.
          konfiguracja = open('tailwind.config.js', encoding='utf-8').read()
          for plik in STRONY:
              if plik not in konfiguracja:
                  bledy.append(f'{plik}: brak w content w tailwind.config.js — style się nie skompilują')

          if bledy:
              print('WDROŻENIE WSTRZYMANE — strona zostaje w poprzedniej wersji:')
              for b in bledy: print('  -', b)
              sys.exit(1)

          print(f'Sprawdzone strony ({len(STRONY)}): {", ".join(STRONY)}')
          print('Struktura, dane strukturalne, analityka, odwołania i arkusz w porządku.')
          PY

      - name: Audyt SEO (31 kryteriów)
        run: python3 audyt.py . 33bots.pl

      - name: Poproś serwer o pobranie zmian
        env:
          ADRES: ${{ secrets.DEPLOY_URL }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "${ADRES:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "Brak sekretu DEPLOY_URL lub DEPLOY_TOKEN — przerywam."
            exit 1
          fi

          KOD=$(curl -sS --max-time 600 --retry 2 --retry-delay 5 \
                     -o /tmp/odpowiedz.txt -w '%{http_code}' \
                     --data-urlencode "token=${TOKEN}" "${ADRES}") || true

          echo "── Odpowiedź serwera (HTTP ${KOD}) ──"
          cat /tmp/odpowiedz.txt
          echo ""

          if [ "${KOD}" != "200" ]; then
            echo "Wdrożenie nie powiodło się."
            exit 1
          fi
          if ! grep -q 'WDROŻENIE ZAKOŃCZONE' /tmp/odpowiedz.txt; then
            echo "Serwer odpowiedział, ale nie potwierdził wdrożenia."
            exit 1
          fi

          {
            echo "### Strona zaktualizowana"
            echo ""
            echo '```'
            grep -E 'Zaktualizowane|Bez zmian|Pominięte|Czas' /tmp/odpowiedz.txt || true
            echo '```'
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\` · https://33bots.pl"
          } >> $GITHUB_STEP_SUMMARY

      # Potwierdzenie, że strona nie tylko odpowiada, ale serwuje właśnie tę
      # wersję, którą wdrażaliśmy. Porównujemy oznaczenie arkusza stylów —
      # gdyby po drodze stanął jakiś bufor, zobaczymy inny numer.
      - name: Potwierdź, że strona serwuje nową wersję
        run: |
          OCZEKIWANA=$(md5sum assets-redesign.css | cut -c1-8)
          echo "Oczekiwana wersja arkusza: ${OCZEKIWANA}"

          KOD=$(curl -sS -o /tmp/strona.html -w '%{http_code}' --max-time 30 \
                     -H 'Cache-Control: no-cache' https://33bots.pl/ || echo 000)
          echo "https://33bots.pl → HTTP ${KOD}"

          if [ "${KOD}" != "200" ]; then
            echo "UWAGA: strona nie zwróciła kodu 200 — sprawdź ręcznie."
            exit 1
          fi

          NA_STRONIE=$(grep -o 'assets-redesign\.css?v=[0-9a-f]*' /tmp/strona.html | head -1 | sed 's/.*v=//')
          echo "Wersja podana przez serwer: ${NA_STRONIE:-brak}"

          if [ "${NA_STRONIE}" = "${OCZEKIWANA}" ]; then
            echo "POTWIERDZONE: strona serwuje wdrożoną wersję."
            echo "Strona potwierdzona — arkusz \`${OCZEKIWANA}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "UWAGA: serwer podaje inną wersję niż wdrożona."
            echo "Najczęstsza przyczyna to bufor po stronie hostingu — odśwież stronę za chwilę."
          fi
