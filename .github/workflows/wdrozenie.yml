name: Wdrożenie na cyber_Folks

# Uruchamia się po każdej zmianie na gałęzi produkcyjnej.
# Można też odpalić ręcznie: Actions → Wdrożenie na cyber_Folks → Run workflow.
#
# Kierunek wdrożenia jest odwrotny niż przy FTP: to serwer sięga po zmiany.
# GitHub jedynie puka do punktu wdrożeniowego, a resztę robi deploy.php
# po stronie hostingu. Dzięki temu nie potrzeba połączenia FTP z zewnątrz,
# które hosting blokuje dla adresów spoza Polski.
on:
  push:
    branches: [claude/33bots-website-T0REs]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'narzedzia-serwer/**'
  workflow_dispatch:

concurrency:
  group: wdrozenie-produkcja
  cancel-in-progress: false

jobs:
  wdroz:
    name: Sprawdź i wdroż
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      # Bramka bezpieczeństwa. Gdy cokolwiek tu nie zagra, serwer nie dostanie
      # sygnału i strona zostaje w poprzedniej, działającej wersji.
      - name: Sprawdź stronę przed wdrożeniem
        run: |
          python3 - <<'PY'
          import hashlib, json, re, sys
          from html.parser import HTMLParser

          zrodlo = open('index.html', encoding='utf-8').read()
          bledy = []

          PUSTE = {'meta','link','img','br','input','source','hr','iframe',
                   'path','circle','rect','polyline','line','polygon','source-marker'}

          class Kontrola(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stos = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('svg', 'iframe'): return
                  if tag not in PUSTE: self.stos.append(tag)
              def handle_endtag(self, tag):
                  if tag in PUSTE or tag == 'svg': return
                  if self.stos and self.stos[-1] == tag: self.stos.pop()
                  elif tag in self.stos:
                      while self.stos and self.stos[-1] != tag:
                          bledy.append(f'niezamknięty <{self.stos.pop()}>')
                      self.stos.pop()
                  else:
                      bledy.append(f'zbłąkany </{tag}>')

          k = Kontrola(); k.feed(zrodlo)
          if k.stos: bledy.append(f'niezamknięte znaczniki: {k.stos}')

          for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', zrodlo, re.S):
              try: json.loads(m.group(1))
              except Exception as e: bledy.append(f'błędny JSON-LD: {e}')

          for konieczny in ('GTM-MR7R7CJ3', 'formspree.io', 'assets-redesign.css'):
              if konieczny not in zrodlo:
                  bledy.append(f'brak w index.html: {konieczny}')

          # Czy arkusz oznaczony w index.html odpowiada temu, który leży w repozytorium.
          # Wyłapuje sytuację, w której ktoś zmienił stronę i zapomniał uruchomić ./buduj.sh
          znacznik = re.search(r'assets-redesign\.css\?v=([0-9a-f]{8})', zrodlo)
          if not znacznik:
              bledy.append('arkusz stylów bez numeru wersji — uruchom ./buduj.sh')
          else:
              suma = hashlib.md5(open('assets-redesign.css','rb').read()).hexdigest()[:8]
              if suma != znacznik.group(1):
                  bledy.append(
                      f'arkusz nie zgadza się ze stroną (w index.html: {znacznik.group(1)}, '
                      f'faktyczny: {suma}) — uruchom ./buduj.sh i zatwierdź zmiany')

          if bledy:
              print('WDROŻENIE WSTRZYMANE — strona zostaje w poprzedniej wersji:')
              for b in bledy: print('  -', b)
              sys.exit(1)

          print('Strona sprawdzona: struktura, dane strukturalne, analityka i arkusz w porządku.')
          PY

      - name: Poproś serwer o pobranie zmian
        env:
          ADRES: ${{ secrets.DEPLOY_URL }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "${ADRES:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "Brak sekretu DEPLOY_URL lub DEPLOY_TOKEN — przerywam."
            exit 1
          fi

          KOD=$(curl -sS --max-time 600 --retry 2 --retry-delay 5 \
                     -o /tmp/odpowiedz.txt -w '%{http_code}' \
                     --data-urlencode "token=${TOKEN}" "${ADRES}") || true

          echo "── Odpowiedź serwera (HTTP ${KOD}) ──"
          cat /tmp/odpowiedz.txt
          echo ""

          if [ "${KOD}" != "200" ]; then
            echo "Wdrożenie nie powiodło się."
            exit 1
          fi
          if ! grep -q 'WDROŻENIE ZAKOŃCZONE' /tmp/odpowiedz.txt; then
            echo "Serwer odpowiedział, ale nie potwierdził wdrożenia."
            exit 1
          fi

          {
            echo "### Strona zaktualizowana"
            echo ""
            echo '```'
            grep -E 'Zaktualizowane|Bez zmian|Pominięte|Czas' /tmp/odpowiedz.txt || true
            echo '```'
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\` · https://33bots.pl"
          } >> $GITHUB_STEP_SUMMARY

      - name: Sprawdź, czy strona odpowiada
        run: |
          KOD=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://33bots.pl/ || echo 000)
          echo "https://33bots.pl → HTTP ${KOD}"
          [ "${KOD}" = "200" ] || echo "UWAGA: strona nie zwróciła kodu 200 — sprawdź ręcznie."
